name: Build and Deploy to S3 and clear CloudFront cache

on:
  # Trigger on push to the main branch.
  push:
    branches:
      - 'main'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set environment variables
        run: |
          echo "ASSUME_ROLE=${{ secrets.AWS_ROLE_ARN }}" >> $GITHUB_ENV
          echo "BUCKET_NAME=${{ secrets.BUCKET_NAME }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ env.ASSUME_ROLE }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        working-directory: astro
        run: yarn install --immutable

      - name: Build
        working-directory: astro
        run: yarn run build

      - name: Ensure rewrite-uri-to-index-html CloudFront Function exists
        run: |
          if ! aws cloudfront describe-function --name rewrite-uri-to-index-html &>/dev/null; then
            ETAG=$(aws cloudfront create-function \
              --name rewrite-uri-to-index-html \
              --function-config Comment="Rewrite URI to index.html",Runtime="cloudfront-js-1.0" \
              --function-code fileb://cloudfront-functions/rewrite-uri-to-index-html.js \
              --query ETag --output text)
            aws cloudfront publish-function \
              --name rewrite-uri-to-index-html \
              --if-match "$ETAG"
            echo "Created and published rewrite-uri-to-index-html"
            echo "::warning::Function created but not associated. Go to AWS Console > CloudFront > Behaviors > Viewer request and add 'rewrite-uri-to-index-html'."
          else
            echo "rewrite-uri-to-index-html already exists, skipping"
          fi

      - name: Deploy
        run: aws s3 sync --region ap-northeast-1 ./astro/dist s3://$BUCKET_NAME --delete

  clear-cloudfront-cache:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Set environment variables
        run: |
          echo "ASSUME_ROLE=${{ secrets.AWS_ROLE_ARN }}" >> $GITHUB_ENV
          echo "DISTRIBUTION_ID=${{ secrets.DISTRIBUTION_ID }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ env.ASSUME_ROLE }}

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  create-release:
    runs-on: ubuntu-latest
    needs: clear-cloudfront-cache
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '.version' astro/package.json)
          TAG="v$VERSION"
          if gh release view "$TAG" &>/dev/null; then
            echo "Tag $TAG already exists, skipping"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi