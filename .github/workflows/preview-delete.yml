name: Delete Preview on Branch Delete

on:
  delete:

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.PREVIEW_AWS_ROLE_ARN }}

      - name: Delete preview from S3
        run: |
          aws s3 rm "s3://${{ secrets.PREVIEW_BUCKET_NAME }}/${{ github.event.ref }}/" --recursive

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PREVIEW_DISTRIBUTION_ID }} \
            --paths "/${{ github.event.ref }}/*"

      - name: Log deleted preview
        run: |
          echo "## Deleted Preview" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.event.ref }}\`" >> $GITHUB_STEP_SUMMARY
