name: Preview Deploy

on:
  push:
    branches:
      - preview/*

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.PREVIEW_AWS_ROLE_ARN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        working-directory: astro
        run: yarn install --immutable

      - name: Verify CloudFront Function is associated
        run: |
          FUNCTION_ARN=$(aws cloudfront get-distribution-config \
            --id ${{ secrets.PREVIEW_DISTRIBUTION_ID }} \
            --query "DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Items[?EventType=='viewer-request'].FunctionARN" \
            --output text)

          if [[ "$FUNCTION_ARN" != *"preview-basic-auth"* ]]; then
            echo "::error::CloudFront Function 'preview-basic-auth' is not associated with the viewer-request event."
            echo "AWSコンソール → CloudFront → ディストリビューション → Behaviors → viewer-request に preview-basic-auth を設定してください。"
            exit 1
          fi

          echo "✓ CloudFront Function association confirmed: $FUNCTION_ARN"

      - name: Deploy CloudFront Basic Auth Function
        env:
          BASIC_AUTH_USER: ${{ secrets.PREVIEW_BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.PREVIEW_BASIC_AUTH_PASS }}
        run: |
          ENCODED=$(echo -n "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" | base64)
          sed "s|__ENCODED__|$ENCODED|" cloudfront-functions/preview-basic-auth.js > /tmp/preview-basic-auth.js

          if ETAG=$(aws cloudfront describe-function --name preview-basic-auth --query ETag --output text 2>/dev/null); then
            NEW_ETAG=$(aws cloudfront update-function \
              --name preview-basic-auth \
              --function-config Comment="Basic Auth for preview",Runtime="cloudfront-js-2.0" \
              --function-code fileb:///tmp/preview-basic-auth.js \
              --if-match "$ETAG" \
              --query ETag --output text)
          else
            NEW_ETAG=$(aws cloudfront create-function \
              --name preview-basic-auth \
              --function-config Comment="Basic Auth for preview",Runtime="cloudfront-js-2.0" \
              --function-code fileb:///tmp/preview-basic-auth.js \
              --query ETag --output text)
          fi

          aws cloudfront publish-function \
            --name preview-basic-auth \
            --if-match "$NEW_ETAG"

      - name: Ensure rewrite-uri-to-index-html CloudFront Function exists
        run: |
          if ! aws cloudfront describe-function --name rewrite-uri-to-index-html &>/dev/null; then
            ETAG=$(aws cloudfront create-function \
              --name rewrite-uri-to-index-html \
              --function-config Comment="Rewrite URI to index.html",Runtime="cloudfront-js-1.0" \
              --function-code fileb://cloudfront-functions/rewrite-uri-to-index-html.js \
              --query ETag --output text)
            aws cloudfront publish-function \
              --name rewrite-uri-to-index-html \
              --if-match "$ETAG"
            echo "Created and published rewrite-uri-to-index-html"
            echo "::warning::Function created but not associated. Go to AWS Console > CloudFront > Behaviors > Viewer request and add 'rewrite-uri-to-index-html'."
          else
            echo "rewrite-uri-to-index-html already exists, skipping"
          fi

      - name: Build
        working-directory: astro
        run: yarn run build
        env:
          BASE_PATH: /${{ github.ref_name }}/

      - name: Deploy to preview S3
        run: |
          aws s3 sync --region ap-northeast-1 ./astro/dist \
            s3://${{ secrets.PREVIEW_BUCKET_NAME }}/${{ github.ref_name }}/ \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PREVIEW_DISTRIBUTION_ID }} \
            --paths "/${{ github.ref_name }}/*"

      - name: Post preview URL to job summary
        run: |
          echo "## Preview" >> $GITHUB_STEP_SUMMARY
          URL=https://${{ vars.PREVIEW_CLOUDFRONT_DOMAIN }}/${{ github.ref_name }}/
          echo "<a href=\"$URL\" target=\"_blank\">$URL</a>" >> $GITHUB_STEP_SUMMARY
