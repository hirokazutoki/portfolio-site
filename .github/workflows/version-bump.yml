name: Update version on release label

on:
  pull_request:
    branches:
      - main
    types:
      - labeled
      - unlabeled

permissions:
  contents: write

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require release label
        if: |
          !contains(github.event.pull_request.labels.*.name, 'release:patch') &&
          !contains(github.event.pull_request.labels.*.name, 'release:minor') &&
          !contains(github.event.pull_request.labels.*.name, 'release:major')
        run: |
          echo "::error::Add a release label: release:patch / release:minor / release:major"
          exit 1

  update-version:
    runs-on: ubuntu-latest
    needs: check-label
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check if version already updated
        id: check-diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff origin/${{ github.base_ref }} HEAD -- astro/package.json | grep '^+.*"version"' | wc -l)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Bump version
        if: steps.check-diff.outputs.changed == '0'
        working-directory: astro
        run: |
          IS_MAJOR="${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}"
          IS_MINOR="${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}"
          if [ "$IS_MAJOR" = "true" ]; then
            BUMP=major
          elif [ "$IS_MINOR" = "true" ]; then
            BUMP=minor
          else
            BUMP=patch
          fi
          npm version $BUMP --no-git-tag-version

      - name: Commit and push
        if: steps.check-diff.outputs.changed == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          VERSION=$(jq -r '.version' astro/package.json)
          git add astro/package.json
          git commit -m "chore: bump version to v$VERSION"
          git push
